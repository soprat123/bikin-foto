name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-bikin-foto-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bikin-foto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN belum ditambahkan ke GitHub Actions secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID belum ditambahkan ke GitHub Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve D1 database and create deployment config
        shell: bash
        run: |
          set -euo pipefail
          D1_LIST="$(npx wrangler d1 list --json)"
          export D1_LIST

          node <<'NODE'
          const fs = require("node:fs");

          const databases = JSON.parse(process.env.D1_LIST || "[]");
          const database = databases.find((item) => item.name === "bikin-foto-db");

          if (!database) {
            throw new Error(
              'Database D1 "bikin-foto-db" tidak ditemukan pada akun Cloudflare ini.',
            );
          }

          const databaseId = database.uuid || database.id;
          if (!databaseId) {
            throw new Error("ID database D1 tidak ditemukan dari respons Wrangler.");
          }

          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.d1_databases = [
            {
              binding: "DB",
              database_name: "bikin-foto-db",
              database_id: databaseId,
            },
          ];

          fs.writeFileSync(
            "wrangler.ci.jsonc",
            `${JSON.stringify(config, null, 2)}\n`,
          );

          console.log(`D1 ditemukan: ${database.name} (${databaseId})`);
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.ci.jsonc --keep-vars
