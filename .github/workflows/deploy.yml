name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-bikin-foto-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bikin-foto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN belum ditambahkan ke Repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID belum ditambahkan ke Repository secrets."
            exit 1
          fi
          echo "GitHub secrets ditemukan."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami

      - name: Resolve D1 database and create deployment config
        shell: bash
        run: |
          set -euo pipefail
          if ! D1_LIST="$(npx wrangler d1 list --json)"; then
            echo "::error::Tidak dapat membaca daftar D1. Pastikan API Token memiliki izin Account > D1 > Edit serta Workers Scripts > Edit."
            exit 1
          fi
          export D1_LIST

          node <<'NODE'
          const fs = require("node:fs");

          const databases = JSON.parse(process.env.D1_LIST || "[]");
          const database = databases.find((item) => item.name === "bikin-foto-db");

          if (!database) {
            throw new Error(
              'Database D1 "bikin-foto-db" tidak ditemukan pada akun Cloudflare yang dipilih.',
            );
          }

          const databaseId = database.uuid || database.id;
          if (!databaseId) {
            throw new Error("ID database D1 tidak ditemukan dari respons Wrangler.");
          }

          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          config.account_id = process.env.CLOUDFLARE_ACCOUNT_ID;
          config.d1_databases = [
            {
              binding: "DB",
              database_name: "bikin-foto-db",
              database_id: databaseId,
              migrations_dir: "migrations",
            },
          ];

          fs.writeFileSync(
            "wrangler.ci.jsonc",
            `${JSON.stringify(config, null, 2)}\n`,
          );

          console.log(`D1 ditemukan: ${database.name} (${databaseId})`);
          NODE

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply bikin-foto-db --remote --config wrangler.ci.jsonc

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.ci.jsonc --keep-vars

      - name: Deployment completed
        run: echo "Worker bikin-foto berhasil dideploy ke Cloudflare."
